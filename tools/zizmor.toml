name = "zizmor"
type = "cli"

[plugin]
description = "Audit GitHub Actions workflows for security issues."
homepage-url = "https://docs.zizmor.sh/"
repository-url = "https://github.com/zizmorcore/zizmor"

[platform.linux]
archs = ["x64", "arm64"]
download-file = "zizmor-{arch}-unknown-linux-gnu.tar.gz"

[platform.macos]
archs = ["x64", "arm64"]
download-file = "zizmor-{arch}-apple-darwin.tar.gz"

[platform.windows]
archs = ["x64"]
download-file = "zizmor-{arch}-pc-windows-msvc.zip"

[install]
download-url = "https://github.com/zizmorcore/zizmor/releases/download/v{version}/{download_file}"

[install.exes.zizmor]
exe-path = "zizmor"
primary = true

[resolve]
git-url = "https://github.com/zizmorcore/zizmor"
version-pattern = '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$'
