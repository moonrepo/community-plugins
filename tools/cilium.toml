name = "Cilium CLI"
type = "cli"

[plugin]
description = "Install, inspect, and troubleshoot Cilium from the command line."
homepage-url = "https://docs.cilium.io/"
repository-url = "https://github.com/cilium/cilium-cli"

[platform.linux]
archs = ["x64", "arm64"]
download-file = "cilium-linux-{arch}.tar.gz"
checksum-file = "cilium-linux-{arch}.tar.gz.sha256sum"

[platform.macos]
archs = ["x64", "arm64"]
download-file = "cilium-darwin-{arch}.tar.gz"
checksum-file = "cilium-darwin-{arch}.tar.gz.sha256sum"

[platform.windows]
archs = ["x64"]
download-file = "cilium-windows-{arch}.zip"
checksum-file = "cilium-windows-{arch}.zip.sha256sum"

[install]
download-url = "https://github.com/cilium/cilium-cli/releases/download/v{version}/{download_file}"
checksum-url = "https://github.com/cilium/cilium-cli/releases/download/v{version}/{checksum_file}"

[install.arch]
x86_64 = "amd64"
aarch64 = "arm64"

[resolve]
git-url = "https://github.com/cilium/cilium-cli"
version-pattern = '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$'
