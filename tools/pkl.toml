name = "Pkl"
type = "cli"

[plugin]
description = "A configuration as code language with rich validation and tooling."
homepage-url = "https://pkl-lang.org/"
repository-url = "https://github.com/apple/pkl"

[resolve]
git-url = "https://github.com/apple/pkl"

# musl builds are only published for x64, as `pkl-alpine-linux-amd64`
[platform.linux]
archs = ["x64", "arm64"]
download-file = "pkl-{libc}linux-{arch}"

# x64 builds were dropped in v0.33
[platform.macos]
archs = ["x64", "arm64"]
download-file = "pkl-macos-{arch}"

# First published in v0.26
[platform.windows]
archs = ["x64"]
download-file = "pkl-windows-{arch}.exe"

[install]
download-url = "https://github.com/apple/pkl/releases/download/{version}/{download_file}"

[install.arch]
x86_64 = "amd64"

[install.libc]
gnu = ""
musl = "alpine-"
