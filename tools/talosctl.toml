name = "Talos CLI"
type = "cli"

[plugin]
description = "Manage Talos Linux nodes and Kubernetes clusters."
homepage-url = "https://siderolabs.com/talos-linux"
repository-url = "https://github.com/siderolabs/talos"

[platform.linux]
archs = ["x64", "arm64"]
download-file = "talosctl-linux-{arch}"
checksum-file = "sha256sum.txt"

[platform.macos]
archs = ["x64", "arm64"]
download-file = "talosctl-darwin-{arch}"
checksum-file = "sha256sum.txt"

[platform.windows]
archs = ["x64"]
download-file = "talosctl-windows-{arch}.exe"
checksum-file = "sha256sum.txt"

[platform.freebsd]
archs = ["x64", "arm64"]
download-file = "talosctl-freebsd-{arch}"
checksum-file = "sha256sum.txt"

[install]
download-url = "https://github.com/siderolabs/talos/releases/download/v{version}/{download_file}"
checksum-url = "https://github.com/siderolabs/talos/releases/download/v{version}/{checksum_file}"

[install.arch]
x86_64 = "amd64"
aarch64 = "arm64"

[resolve]
git-url = "https://github.com/siderolabs/talos"
version-pattern = '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$'
